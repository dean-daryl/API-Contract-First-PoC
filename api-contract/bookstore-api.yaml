openapi: 3.0.3
info:
  title: Bookstore API
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

tags:
  - name: Books
    description: Operations for managing books
  - name: Authors
    description: Operations for managing authors

paths:
  /books:
    get:
      operationId: getBooks
      summary: Get all books
      tags:
        - Books
      responses:
        '200':
          description: A list of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      operationId: createBook
      summary: Create a new book
      tags:
        - Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Invalid input - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - a book with the same ISBN already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /books/{bookId}:
    get:
      operationId: getBookById
      summary: Get a book by ID
      tags:
        - Books
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The requested book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateBook
      summary: Update a book
      tags:
        - Books
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '200':
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Invalid input - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - a book with the same ISBN already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteBook
      summary: Delete a book
      tags:
        - Books
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Book deleted successfully
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /authors:
    get:
      operationId: getAuthors
      summary: Get all authors
      tags:
        - Authors
      responses:
        '200':
          description: A list of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
    post:
      operationId: createAuthor
      summary: Create a new author
      tags:
        - Authors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorRequest'
      responses:
        '201':
          description: Author created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Invalid input - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - an author with the same name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /authors/{authorId}:
    get:
      operationId: getAuthorById
      summary: Get an author by ID
      tags:
        - Authors
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The requested author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          description: Author not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateAuthor
      summary: Update an author
      tags:
        - Authors
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorRequest'
      responses:
        '200':
          description: Author updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Invalid input - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Author not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - an author with the same name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteAuthor
      summary: Delete an author
      tags:
        - Authors
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Author deleted successfully
        '404':
          description: Author not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Book:
      type: object
      required:
        - id
        - title
        - authorId
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier
        bookTitle:
          type: string
          minLength: 1
          maxLength: 255
          description: Title of the book
        isbn:
          type: string
          maxLength: 17
          description: ISBN-13 of the book
        authorId:
          type: integer
          format: int64
          minimum: 1
          description: ID of the author
        publishedYear:
          type: integer
          minimum: 1000
          maximum: 2100
          description: Year published

    BookRequest:
      type: object
      required:
        - title
        - authorId
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "{Title Required}")'
          x-validation-message-key: Title Required
          description: Title of the book
        isbn:
          type: string
          pattern: '^(97[89])-\\d{1,5}-\\d{1,7}-\\d{1,7}-\\d$'
          maxLength: 17
          x-field-extra-annotation: '@jakarta.validation.constraints.Pattern(regexp = "^(97[89])-\\d{1,5}-\\d{1,7}-\\d{1,7}-\\d$", message = "{validation.book.isbn.invalid}")'
          x-validation-message-key: validation.book.isbn.invalid
          description: ISBN-13 of the book
        authorId:
          type: integer
          format: int64
          minimum: 1
          x-field-extra-annotation: '@jakarta.validation.constraints.NotNull(message = "{validation.book.authorId.required}") @jakarta.validation.constraints.Min(value = 1, message = "{validation.book.authorId.min}")'
          x-validation-message-keys:
            - validation.book.authorId.required
            - validation.book.authorId.min
          description: ID of the author
        publishedYear:
          type: integer
          minimum: 1000
          maximum: 2100
          x-field-extra-annotation: '@jakarta.validation.constraints.Min(value = 1000, message = "{validation.book.publishedYear.min}") @jakarta.validation.constraints.Max(value = 2100, message = "{validation.book.publishedYear.max}")'
          x-validation-message-keys:
            - validation.book.publishedYear.min
            - validation.book.publishedYear.max
          description: Year the book was published
    Author:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier
        authorName:
          type: string
          minLength: 1
          maxLength: 150
          description: Full name of the author
        bio:
          type: string
          maxLength: 2000
          description: Biography of the author

    AuthorRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "{validation.author.name.required}")'
          x-validation-message-key: validation.author.name.required
          description: Full name of the author
        bio:
          type: string
          maxLength: 2000
          x-field-extra-annotation: '@jakarta.validation.constraints.Size(max = 2000, message = "{validation.author.bio.maxLength}")'
          x-validation-message-key: validation.author.bio.maxLength
          description: Biography of the author

    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          description: Field-level validation errors (present on 400 responses)

    ValidationError:
      type: object
      required:
        - field
        - messageKey
      properties:
        field:
          type: string
          description: The field that failed validation
        messageKey:
          type: string
          description: Translation key for the validation message (e.g. Title Required)
        message:
          type: string
          description: Default English message (fallback when translation is not available)
        rejectedValue:
          type: object
          description: The value that was rejected
